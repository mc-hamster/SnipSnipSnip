name: CI Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run test suite
        env:
          SSS_RUN_EXTERNAL_HTML_BROWSER_TESTS: "1"
          SSS_REQUIRE_EXTERNAL_HTML_BROWSERS: "1"
        run: |
          Tools/run-release-test-gate.sh \
            --derived-data "$RUNNER_TEMP/DerivedData" \
            --result-bundle "$RUNNER_TEMP/TestResults.xcresult"

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: warn
