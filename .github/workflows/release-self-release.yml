name: Release Self Hosted Build

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Optional release notes override
        required: false
        type: string
      prerelease:
        description: Mark GitHub release as pre-release
        required: true
        default: true
        type: boolean
      draft:
        description: Create GitHub release as draft
        required: true
        default: false
        type: boolean

concurrency:
  group: self-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run release test gate
        env:
          SSS_RUN_EXTERNAL_HTML_BROWSER_TESTS: "1"
          SSS_REQUIRE_EXTERNAL_HTML_BROWSERS: "1"
        run: |
          Tools/run-release-test-gate.sh \
            --derived-data "$RUNNER_TEMP/DerivedDataReleaseGate"

  release:
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby with bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fastlane self release publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SKIP_TESTS: "true"
        run: |
          lane_args="prerelease:${{ inputs.prerelease }} draft:${{ inputs.draft }}"

          if [ -n "${{ inputs.changelog }}" ]; then
            lane_args="$lane_args changelog:${{ inputs.changelog }}"
          fi

          ./bin/fastlane mac self_release_publish $lane_args
